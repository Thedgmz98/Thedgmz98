<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Edwin Santiago — Full Stack Developer · Security Mindset">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0A0A0F" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#0066FF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0066FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#0066FF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0066FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="14"/>
    </clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,'Liberation Mono',monospace}
      .name{font-size:54px;font-weight:300;letter-spacing:14px;fill:#0A0A0F}
      .role{font-size:14px;letter-spacing:6px;fill:#0066FF}
      .meta{font-size:11px;letter-spacing:3px;fill:#8A8A99}
      .cursor{animation:blink 1.1s steps(1) infinite}
      .scanline{animation:scan 7s cubic-bezier(.6,0,.4,1) infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes blink{50%{opacity:0}}
      @keyframes scan{0%{transform:translateY(-8px);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(328px);opacity:0}}
      @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
      @media (prefers-reduced-motion: reduce){.cursor,.scanline,.pulse{animation:none}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="#F6F6F8"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect class="scanline" x="0" y="0" width="1200" height="1.5" fill="url(#scan)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#0A0A0F" stroke-opacity="0.08"/>

  <!-- corner brackets -->
  <g stroke="#0066FF" stroke-width="1.5" fill="none" stroke-opacity="0.7">
    <path d="M40 64V40H64"/>
    <path d="M1136 40H1160V64"/>
    <path d="M40 256V280H64"/>
    <path d="M1160 256V280H1136"/>
  </g>

  <!-- top meta -->
  <text x="78" y="57" class="mono meta">SYS://EDWIN.DEV</text>
  <text x="1122" y="57" class="mono meta" text-anchor="end">BUILD 2026.10 — CO</text>

  <!-- identity -->
  <text x="607" y="168" text-anchor="middle" class="mono name">EDWIN SANTIAGO<tspan class="cursor" fill="#0066FF">_</tspan></text>
  <text x="603" y="210" text-anchor="middle" class="mono role">FULL STACK DEVELOPER  /  SECURITY MINDSET</text>
  <line x1="540" x2="660" y1="234" y2="234" stroke="#0066FF" stroke-opacity="0.45" stroke-width="1"/>

  <!-- bottom meta -->
  <circle class="pulse" cx="83" cy="264" r="3.5" fill="#0066FF"/>
  <text x="96" y="268" class="mono meta">STATUS: BUILDING IN PUBLIC</text>
  <text x="1122" y="268" class="mono meta" text-anchor="end">0 → DEV</text>
</svg>
